"name": |-
  Developer Activity by Language
"description": |-
  Developer activity by programming language.
"query": "MATCH (p:Person)-[:AUTHORED_BY]-(c:Commit)-[:MODIFIES]->(f:File)\n    RETURN\
  \ p.name as developer, f.language as language, \n           count(DISTINCT c) as\
  \ commits, count(f) as files_touched\n    ORDER BY commits DESC"
