"name": |-
  PR Size Distribution
"description": |-
  PR size distribution by commit count.
"query": "MATCH (pr:PullRequest)\n    WITH pr,\n         CASE \n           WHEN pr.commits_count\
  \ <= 3 THEN 'Small (1-3 commits)'\n           WHEN pr.commits_count <= 8 THEN 'Medium\
  \ (4-8 commits)'\n           ELSE 'Large (9+ commits)'\n         END as size_category\n\
  \    RETURN size_category, count(pr) as pr_count\n    ORDER BY pr_count DESC"
