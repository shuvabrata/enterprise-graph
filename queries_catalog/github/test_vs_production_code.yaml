"name": |-
  Test vs Production Code
"description": |-
  Test vs production code analysis.
"query": "MATCH (f:File)<-[:MODIFIES]-(c:Commit)\n    WITH f.is_test as is_test, \n\
  \         count(DISTINCT f) as file_count,\n         count(c) as commit_count\n\
  \    RETURN CASE WHEN is_test THEN 'Test Files' ELSE 'Production Files' END as type,\n\
  \           file_count, commit_count"
