"name": |-
  Epics with Owners and Teams
"description": |-
  Complete epic context with owners, teams, and initiatives.
"query": "MATCH (e:Epic)-[:ASSIGNED_TO]-(owner:Person)\n    MATCH (e)-[:TEAM]-(team:Team)\n\
  \    MATCH (e)-[:PART_OF]->(i:Initiative)\n    RETURN e.key, e.summary, \n     \
  \      owner.name as owner, owner.title as owner_title,\n           team.name as\
  \ team,\n           i.key as initiative,\n           e.status, e.priority"
